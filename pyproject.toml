[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts-plugin-kokoro"
version = "0.1.0"
description = "Kokoro-TTS Engine Connector for tts-plugin-bridge"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tts-plugin-bridge",
    "kokoro",
    "soundfile",
]

[tool.uv.sources]
tts-plugin-bridge = { path = "../tts-plugin-bridge", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[project.entry-points."tts_bridge.connectors"]
kokoro = "tts_plugin_kokoro.connector:KokoroConnector"

[tool.hatch.build.targets.wheel]
packages = ["tts_plugin_kokoro"]
